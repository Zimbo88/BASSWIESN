# Tool configuration only. Deployment remains source-based; no packaging rewrite.
[tool.uv]
required-version = "==0.13.4"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "dist", "test-artifacts", "docs/generated"]

[tool.ruff.lint]
# Start with actual correctness failures, not a mass style rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = [
  "basswiesn/app/core/xml_safety.py",
  "tools/display_emulator.py", "basswiesn/app/services/display_composition.py",
