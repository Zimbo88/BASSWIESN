[tool.coverage.run]
branch = true
source = ["basswiesn"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# No invented minimum. A measured baseline is enforced separately.

[tool.coverage.json]
show_contexts = false
