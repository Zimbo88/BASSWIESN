[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: schnelle Tests ohne App-Server oder echte Geraete
    integration: Datenbank-, FastAPI-, Service- oder Ablauf-Tests ohne Browser
    browser: Playwright-/Browsertests mit eigenem lokalen Server
    slow: Tests mit bewusst laengerem Ablauf, Polling oder mehreren App-Starts
    hardware: manuelle Tests gegen echte SoundTouch-Geraete; nie automatisch starten
    release: release-relevante Softwaretests und Paket-Hardening
