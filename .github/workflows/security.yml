name: Security and supply chain
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: python tools/check_dependency_lock.py
      - run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash tools/scan_secrets.sh

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: image
        run: docker build --tag basswiesn:security .
      - id: scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: basswiesn:security
          format: json
          output: container-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Container SBOM
        if: ${{ always() && steps.image.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          trivy image --format cyclonedx --output container-sbom-packages.json basswiesn:security
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint python \
            basswiesn:security tools/check_ssh_provenance.py > ssh-source-component.json
          python3 tools/check_ssh_provenance.py --merge-sbom container-sbom-packages.json \
            --component ssh-source-component.json > container-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.image.outcome == 'success' }}
        with:
          name: container-security-evidence-${{ matrix.architecture }}
          path: |
            container-sbom.json
            container-sbom-packages.json
            ssh-source-component.json
            container-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7
